<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Agnes Easy Use">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="14" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="0.45" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- 散布在 A 周围的星光（参考 AI 出图布局） -->
  <g fill="#fde68a">
    <!-- 左上小圆点 -->
    <circle cx="18" cy="20" r="1.5" opacity="0.8"/>
    <!-- 左中圆点 -->
    <circle cx="14" cy="40" r="1.5" opacity="0.7"/>
    <!-- 右上大四角星 -->
    <path d="M45 22 L46 25 L49 26 L46 27 L45 30 L44 27 L41 26 L44 25 Z" opacity="0.95"/>
    <!-- 右下小四角星 -->
    <path d="M41 48 L42 50 L44 51 L42 52 L41 54 L40 52 L38 51 L40 50 Z" opacity="0.75"/>
    <!-- 右边缘微点 -->
    <circle cx="52" cy="43" r="1" opacity="0.55"/>
  </g>

  <g filter="url(#glow)" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 47 L32 17 L42 47"/>
    <path d="M26 37 L38 37"/>
  </g>
</svg>
